<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Listening Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --bg-card: #ffffff;
      --bg-hover: #f5f0ea;
      --text: #1a1a2e;
      --text-secondary: #5a5a7a;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --accent-bg: #fdf0ef;
      --correct: #27ae60;
      --correct-bg: #eafaf1;
      --wrong: #c0392b;
      --wrong-bg: #fdf0ef;
      --border: #e8e4df;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
      --n5-color: #2980b9;
      --n5-bg: #ebf5fb;
      --n4-color: #8e44ad;
      --n4-bg: #f4ecf7;
      --radius: 12px;
      --radius-lg: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    header { text-align: center; padding: 40px 16px 20px; }
    header h1 { font-family: 'Noto Sans JP', sans-serif; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header h1 .jp { color: var(--accent); }
    header p { color: var(--text-secondary); margin-top: 6px; font-size: 0.95rem; }

    .level-select { display: flex; gap: 16px; justify-content: center; margin: 32px 0; }
    .level-card {
      flex: 1; max-width: 280px; background: var(--bg-card); border: 2px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px 20px; text-align: center;
      cursor: pointer; transition: all 0.25s ease; position: relative; overflow: hidden;
    }
    .level-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .level-card.n5 { border-color: transparent; background: var(--n5-bg); }
    .level-card.n5:hover { border-color: var(--n5-color); }
    .level-card.n4 { border-color: transparent; background: var(--n4-bg); }
    .level-card.n4:hover { border-color: var(--n4-color); }
    .level-card .level-badge { display: inline-block; font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
    .level-card.n5 .level-badge { color: var(--n5-color); }
    .level-card.n4 .level-badge { color: var(--n4-color); }
    .level-card .level-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
    .level-card .level-desc { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; opacity: 0.8; }

    .srs-stats {
      display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap;
    }
    .srs-stat {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 6px;
      background: rgba(0,0,0,0.05); color: var(--text-secondary); font-weight: 600;
    }
    .srs-stat.new { color: var(--n5-color); }
    .srs-stat.learning { color: #e67e22; }
    .srs-stat.mastered { color: var(--correct); }

    .quiz-screen { display: none; }
    .quiz-screen.active { display: block; }
    .quiz-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 16px; }
    .back-btn {
      background: none; border: none; font-size: 0.9rem; color: var(--text-secondary);
      cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 8px 12px;
      border-radius: var(--radius); transition: background 0.2s;
    }
    .back-btn:hover { background: var(--bg-hover); }
    .progress-info { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
    .score-info { font-size: 0.85rem; font-weight: 600; color: var(--correct); }

    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 28px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
    .n5-theme .progress-fill { background: var(--n5-color); }
    .n4-theme .progress-fill { background: var(--n4-color); }

    .question-type {
      display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; padding: 4px 10px; border-radius: 6px; margin-bottom: 16px;
    }
    .n5-theme .question-type { background: var(--n5-bg); color: var(--n5-color); }
    .n4-theme .question-type { background: var(--n4-bg); color: var(--n4-color); }

    .audio-section {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 32px;
      text-align: center; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .play-btn {
      width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
    }
    .n5-theme .play-btn { background: var(--n5-bg); color: var(--n5-color); }
    .n4-theme .play-btn { background: var(--n4-bg); color: var(--n4-color); }
    .play-btn:hover { transform: scale(1.08); box-shadow: var(--shadow-lg); }
    .play-btn.playing { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .play-btn svg { width: 28px; height: 28px; }
    .play-hint { margin-top: 12px; font-size: 0.8rem; color: var(--text-secondary); }
    .question-text { margin-top: 20px; font-size: 1rem; color: var(--text); font-weight: 500; }

    .speed-control { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; }
    .speed-btn {
      background: var(--bg-hover); border: 1.5px solid var(--border); border-radius: 8px;
      padding: 4px 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
      color: var(--text-secondary); transition: all 0.2s;
    }
    .speed-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .option-btn {
      width: 100%; text-align: left; background: var(--bg-card); border: 2px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px; font-size: 0.95rem;
      font-family: 'Inter', 'Noto Sans JP', sans-serif; cursor: pointer;
      transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; line-height: 1.5;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--text-secondary); background: var(--bg-hover); }
    .option-label {
      width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
      background: var(--bg); color: var(--text-secondary);
    }
    .option-btn.correct { border-color: var(--correct); background: var(--correct-bg); }
    .option-btn.correct .option-label { background: var(--correct); color: #fff; }
    .option-btn.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
    .option-btn.wrong .option-label { background: var(--wrong); color: #fff; }
    .option-btn:disabled { cursor: default; opacity: 0.6; }
    .option-btn.correct:disabled, .option-btn.wrong:disabled { opacity: 1; }

    .explanation {
      display: none; background: var(--bg-card); border-radius: var(--radius); padding: 20px;
      margin-bottom: 16px; box-shadow: var(--shadow); border-left: 4px solid var(--correct);
      animation: slideIn 0.3s ease;
    }
    .explanation.visible { display: block; }
    .explanation .jp-sentence { font-family: 'Noto Sans JP', sans-serif; font-size: 1.15rem; margin-bottom: 8px; }
    .explanation .romaji { font-size: 0.85rem; color: var(--text-secondary); font-style: italic; margin-bottom: 6px; }
    .explanation .translation { font-size: 0.9rem; color: var(--text-secondary); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .next-btn {
      width: 100%; padding: 16px; font-size: 1rem; font-weight: 600; border: none;
      border-radius: var(--radius); cursor: pointer; color: #fff; transition: all 0.2s; display: none;
    }
    .next-btn.visible { display: block; }
    .n5-theme .next-btn { background: var(--n5-color); }
    .n4-theme .next-btn { background: var(--n4-color); }
    .next-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .results-screen { display: none; }
    .results-screen.active { display: block; }
    .results-card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 40px 28px;
      text-align: center; box-shadow: var(--shadow-lg); margin: 24px 0;
    }
    .results-score { font-size: 4rem; font-weight: 700; line-height: 1; }
    .results-score .of { font-size: 1.5rem; color: var(--text-secondary); font-weight: 400; }
    .results-label { font-size: 1rem; color: var(--text-secondary); margin-top: 8px; }
    .results-message { font-size: 1.1rem; margin-top: 20px; padding: 12px 20px; border-radius: var(--radius); font-weight: 500; }
    .results-message.great { background: var(--correct-bg); color: var(--correct); }
    .results-message.good { background: var(--n5-bg); color: var(--n5-color); }
    .results-message.retry { background: var(--wrong-bg); color: var(--wrong); }
    .results-actions { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }
    .results-actions button {
      padding: 14px 28px; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; border: 2px solid var(--border);
      background: var(--bg-card); color: var(--text);
    }
    .results-actions button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .results-actions .primary-btn { border: none; color: #fff; }
    .n5-theme .primary-btn { background: var(--n5-color); }
    .n4-theme .primary-btn { background: var(--n4-color); }

    .review-list { margin-top: 24px; text-align: left; }
    .review-list h3 { font-size: 1rem; margin-bottom: 12px; }
    .review-item {
      background: var(--bg-card); border-radius: var(--radius); padding: 16px;
      margin-bottom: 8px; border-left: 4px solid; box-shadow: var(--shadow); cursor: pointer;
    }
    .review-item.was-correct { border-color: var(--correct); }
    .review-item.was-wrong { border-color: var(--wrong); }
    .review-item .ri-sentence { font-family: 'Noto Sans JP', sans-serif; font-size: 1rem; margin-bottom: 4px; }
    .review-item .ri-answer { font-size: 0.85rem; color: var(--text-secondary); }
    .review-item .ri-answer strong { color: var(--correct); }

    .reset-btn {
      display: block; margin: 20px auto 0; background: none; border: none; font-size: 0.8rem;
      color: var(--text-secondary); cursor: pointer; text-decoration: underline; opacity: 0.6;
    }
    .reset-btn:hover { opacity: 1; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.6rem; }
      .level-select { flex-direction: column; align-items: center; }
      .level-card { max-width: 100%; }
      .audio-section { padding: 24px 16px; }
      .results-card { padding: 28px 20px; }
      .results-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div id="home-screen">
    <header>
      <h1><span class="jp">聴解</span> Listening Practice</h1>
      <p>Train your ear for the JLPT listening section</p>
    </header>
    <div class="container">
      <div class="level-select">
        <div class="level-card n5" onclick="startQuiz('n5')">
          <div class="level-badge">N5</div>
          <div class="level-label">Beginner</div>
          <div class="level-desc" id="n5-desc">50 questions</div>
          <div class="srs-stats" id="n5-stats"></div>
        </div>
        <div class="level-card n4" onclick="startQuiz('n4')">
          <div class="level-badge">N4</div>
          <div class="level-label">Elementary</div>
          <div class="level-desc" id="n4-desc">150 questions</div>
          <div class="srs-stats" id="n4-stats"></div>
        </div>
      </div>
      <button class="reset-btn" onclick="resetProgress()">Reset all progress</button>
    </div>
  </div>

  <div id="quiz-screen" class="quiz-screen">
    <div class="container">
      <div class="quiz-header">
        <button class="back-btn" onclick="goHome()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <span class="progress-info" id="progress-info"></span>
        <span class="score-info" id="score-info"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="question-type" class="question-type"></div>
      <div class="audio-section">
        <button class="play-btn" id="play-btn" onclick="playAudio()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="play-hint" id="play-hint">Tap to listen</div>
        <div class="speed-control">
          <button class="speed-btn" data-speed="0.7" onclick="setSpeed(0.7, this)">Slow</button>
          <button class="speed-btn active" data-speed="1" onclick="setSpeed(1, this)">Normal</button>
        </div>
        <div class="question-text" id="question-text"></div>
      </div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation">
        <div class="jp-sentence" id="exp-sentence"></div>
        <div class="romaji" id="exp-romaji"></div>
        <div class="translation" id="exp-translation"></div>
      </div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>

  <div id="results-screen" class="results-screen">
    <div class="container">
      <div class="quiz-header">
        <button class="back-btn" onclick="goHome()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Home
        </button>
      </div>
      <div class="results-card">
        <div class="results-score" id="results-score"></div>
        <div class="results-label">Correct Answers</div>
        <div class="results-message" id="results-message"></div>
        <div class="results-actions">
          <button class="primary-btn" onclick="startQuiz(currentLevel)">Next Round</button>
          <button onclick="goHome()">Change Level</button>
        </div>
      </div>
      <div class="review-list" id="review-list"><h3>Review</h3></div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script>
    const SESSION_SIZE = 10;
    const STORAGE_KEY = 'jlpt_listening_srs';

    // --- SRS ---
    function loadSRS() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch { return {}; }
    }

    function saveSRS(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    }

    function getSRSLevel(data, level) {
      if (!data[level]) data[level] = { session: 0, questions: {} };
      return data[level];
    }

    function getQuestionSRS(levelData, qid) {
      if (!levelData.questions[qid]) levelData.questions[qid] = { box: 0, lastSession: -999 };
      return levelData.questions[qid];
    }

    function isDue(qSRS, currentSession) {
      if (qSRS.box === 0) return false; // new, not "due" — picked separately
      const interval = Math.pow(2, qSRS.box - 1); // box1=1, box2=2, box3=4, box4=8
      return (currentSession - qSRS.lastSession) >= interval;
    }

    function pickQuestions(level) {
      const data = loadSRS();
      const ld = getSRSLevel(data, level);
      ld.session++;
      saveSRS(data);

      const allQ = QUESTIONS[level];
      const due = [];
      const fresh = [];
      const notDue = [];

      allQ.forEach((q, idx) => {
        const qs = getQuestionSRS(ld, q.id);
        if (qs.box === 0) {
          fresh.push(idx);
        } else if (isDue(qs, ld.session)) {
          due.push(idx);
        } else {
          notDue.push(idx);
        }
      });

      // Shuffle each group
      shuffle(due);
      shuffle(fresh);
      shuffle(notDue);

      // Pick: due first, then fresh, then not-due if needed
      const picked = [];
      for (const idx of due) { if (picked.length >= SESSION_SIZE) break; picked.push(idx); }
      for (const idx of fresh) { if (picked.length >= SESSION_SIZE) break; picked.push(idx); }
      for (const idx of notDue) { if (picked.length >= SESSION_SIZE) break; picked.push(idx); }

      shuffle(picked);
      return picked;
    }

    function recordAnswer(level, qid, correct) {
      const data = loadSRS();
      const ld = getSRSLevel(data, level);
      const qs = getQuestionSRS(ld, qid);
      if (correct) {
        qs.box = Math.min(qs.box + 1, 4);
      } else {
        qs.box = 1;
      }
      qs.lastSession = ld.session;
      saveSRS(data);
    }

    function getStats(level) {
      const data = loadSRS();
      const ld = getSRSLevel(data, level);
      const allQ = QUESTIONS[level];
      let newCount = 0, learning = 0, mastered = 0;
      allQ.forEach(q => {
        const qs = getQuestionSRS(ld, q.id);
        if (qs.box === 0) newCount++;
        else if (qs.box >= 3) mastered++;
        else learning++;
      });
      return { newCount, learning, mastered, total: allQ.length };
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // --- State ---
    let currentLevel = null;
    let sessionIndices = [];
    let sessionPos = 0;
    let score = 0;
    let answered = false;
    let speechRate = 1;
    let userAnswers = [];
    let currentAudio = null;

    function updateHomeStats() {
      ['n5', 'n4'].forEach(level => {
        const s = getStats(level);
        const el = document.getElementById(level + '-stats');
        el.innerHTML = `
          <span class="srs-stat new">${s.newCount} new</span>
          <span class="srs-stat learning">${s.learning} learning</span>
          <span class="srs-stat mastered">${s.mastered} mastered</span>
        `;
        document.getElementById(level + '-desc').textContent =
          `${s.total} questions`;
      });
    }

    function startQuiz(level) {
      currentLevel = level;
      sessionIndices = pickQuestions(level);
      sessionPos = 0;
      score = 0;
      answered = false;
      userAnswers = [];

      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('results-screen').classList.remove('active');
      const quizScreen = document.getElementById('quiz-screen');
      quizScreen.classList.add('active');
      quizScreen.classList.remove('n5-theme', 'n4-theme');
      quizScreen.classList.add(level + '-theme');

      showQuestion();
    }

    function showQuestion() {
      const qIdx = sessionIndices[sessionPos];
      const q = QUESTIONS[currentLevel][qIdx];
      const total = sessionIndices.length;
      answered = false;

      document.getElementById('progress-info').textContent = `${sessionPos + 1} / ${total}`;
      document.getElementById('score-info').textContent = `${score} correct`;
      document.getElementById('progress-fill').style.width = `${(sessionPos / total) * 100}%`;
      document.getElementById('question-type').textContent = q.type;
      document.getElementById('question-text').textContent = q.question;
      document.getElementById('play-hint').textContent = 'Tap to listen';

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';
      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-label">${labels[i]}</span><span>${opt}</span>`;
        btn.onclick = () => selectAnswer(i);
        optionsEl.appendChild(btn);
      });

      document.getElementById('explanation').classList.remove('visible');
      document.getElementById('next-btn').classList.remove('visible');
      document.getElementById('play-btn').classList.remove('playing');

      setTimeout(() => playAudio(), 500);
    }

    function playAudio() {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      const qIdx = sessionIndices[sessionPos];
      const suffix = speechRate < 1 ? '_slow' : '';
      currentAudio = new Audio(`audio/${currentLevel}/q${qIdx}${suffix}.mp3`);

      const playBtn = document.getElementById('play-btn');
      playBtn.classList.add('playing');
      document.getElementById('play-hint').textContent = 'Playing...';

      currentAudio.onended = () => {
        playBtn.classList.remove('playing');
        document.getElementById('play-hint').textContent = 'Tap to replay';
      };
      currentAudio.onerror = () => {
        playBtn.classList.remove('playing');
        document.getElementById('play-hint').textContent = 'Audio error — tap to retry';
      };
      currentAudio.play();
    }

    function playReviewAudio(level, arrayIdx) {
      if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      currentAudio = new Audio(`audio/${level}/q${arrayIdx}.mp3`);
      currentAudio.play();
    }

    function setSpeed(speed, btn) {
      speechRate = speed;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;

      const qIdx = sessionIndices[sessionPos];
      const q = QUESTIONS[currentLevel][qIdx];
      const isCorrect = index === q.correct;
      if (isCorrect) score++;

      recordAnswer(currentLevel, q.id, isCorrect);
      userAnswers.push({ arrayIndex: qIdx, chosen: index, correct: isCorrect });

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add('correct');
        if (i === index && !isCorrect) btn.classList.add('wrong');
      });

      document.getElementById('score-info').textContent = `${score} correct`;
      document.getElementById('exp-sentence').textContent = q.audio;
      document.getElementById('exp-romaji').textContent = q.romaji;
      document.getElementById('exp-translation').textContent = q.translation;
      document.getElementById('explanation').classList.add('visible');

      const nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = sessionPos < sessionIndices.length - 1 ? 'Next Question' : 'See Results';
      nextBtn.classList.add('visible');
    }

    function nextQuestion() {
      sessionPos++;
      if (sessionPos >= sessionIndices.length) { showResults(); return; }
      showQuestion();
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.remove('active');
      const rs = document.getElementById('results-screen');
      rs.classList.add('active');
      rs.classList.remove('n5-theme', 'n4-theme');
      rs.classList.add(currentLevel + '-theme');

      const total = sessionIndices.length;
      const pct = score / total;
      document.getElementById('results-score').innerHTML = `${score} <span class="of">/ ${total}</span>`;

      const msgEl = document.getElementById('results-message');
      if (pct >= 0.8) { msgEl.textContent = 'Excellent! Your listening skills are strong!'; msgEl.className = 'results-message great'; }
      else if (pct >= 0.5) { msgEl.textContent = 'Good effort! Keep practicing to improve.'; msgEl.className = 'results-message good'; }
      else { msgEl.textContent = "Don't give up! Practice makes perfect."; msgEl.className = 'results-message retry'; }

      document.getElementById('progress-fill').style.width = '100%';

      const reviewEl = document.getElementById('review-list');
      reviewEl.innerHTML = '<h3>Review</h3>';
      userAnswers.forEach(a => {
        const q = QUESTIONS[currentLevel][a.arrayIndex];
        const div = document.createElement('div');
        div.className = `review-item ${a.correct ? 'was-correct' : 'was-wrong'}`;
        div.innerHTML = `
          <div class="ri-sentence">${q.audio}</div>
          <div class="ri-answer">${a.correct ? '&#10003;' : '&#10007;'} ${q.options[a.chosen]}${!a.correct ? ' &rarr; <strong>' + q.options[q.correct] + '</strong>' : ''}</div>
        `;
        div.title = 'Click to replay';
        div.onclick = () => playReviewAudio(currentLevel, a.arrayIndex);
        reviewEl.appendChild(div);
      });
    }

    function goHome() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      document.getElementById('quiz-screen').classList.remove('active');
      document.getElementById('results-screen').classList.remove('active');
      document.getElementById('home-screen').style.display = 'block';
      updateHomeStats();
    }

    function resetProgress() {
      if (confirm('Reset all progress? This cannot be undone.')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        updateHomeStats();
      }
    }

    updateHomeStats();
  </script>
</body>
</html>
